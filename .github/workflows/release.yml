name: release

# 每次打上形如 v1.0.0 的 tag，自动构建并发布多平台、多格式的发行包。
# 覆盖 Linux（Debian/Ubuntu *.deb、Red Hat/Fedora *.rpm、通用便携 *.tar.gz）、
# Windows（*.zip，已用 windeployqt 内嵌 Qt 运行库）、macOS（*.tar.gz，已用 macdeployqt）
# 以及 Arch Linux（*.tar.gz）。文件名带版本 + 日期，并附 SHA256SUMS。
#
# 前端是 Qt6 跨平台 GUI；Linux 包声明 Qt6 为系统依赖；Windows/macOS 会内嵌 Qt 运行库。
#
# 说明：Linux 步骤保证可打包；Windows/macOS/Arch 因需云端 Qt 工具链，脚本按标准写法，
# 首次跑可能有平台相关报错，需按 CI 输出微调（见 workflow 注释）。

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # 允许把构建产物挂载到 GitHub Release

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install toolchain (含 Qt6)
        run: |
          sudo apt-get update
          sudo apt-get install -y make gcc binutils zip rpm pkg-config qt6-base-dev

      - name: Resolve version and date
        id: meta
        run: |
          VER="${GITHUB_REF_NAME#v}"
          echo "ver=${VER}" >> "$GITHUB_OUTPUT"
          echo "date=$(date +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Build Linux launcher (Qt GUI)
        run: |
          make clean
          make            # FE=auto -> qt（qt6-base-dev 提供 pkg-config）
          mkdir -p pkg/usr/bin pkg/usr/share/pc-sim
          cp dist/apps/pc_sim_launcher pkg/usr/bin/pc_sim_launcher
          cp dist/firmware/pc_compat_bios.bin pkg/usr/share/pc-sim/pc_compat_bios.bin
          chmod 755 pkg/usr/bin/pc_sim_launcher
          mkdir -p portable/pc-sim-linux
          cp dist/apps/pc_sim_launcher portable/pc-sim-linux/
          cp dist/firmware/pc_compat_bios.bin portable/pc-sim-linux/
          chmod +x portable/pc-sim-linux/pc_sim_launcher
          cat > portable/pc-sim-linux/README.txt <<'EOF'
          8086 CPU Simulator — 免安装、免编译，解压即用

          启动方式：
            Linux:  ./pc_sim_launcher

          说明：本版为 Qt6 图形界面。运行需系统已安装 Qt6（Debian/Ubuntu:
          libqt6widgets6；Fedora/RHEL: qt6-qtbase；Arch: qt6-base）。
          本目录已内置 BIOS 镜像（pc_compat_bios.bin）。
          如需从源码构建，请参考项目 README。
          EOF

      - name: Package Debian/Ubuntu (.deb)
        env:
          VER: ${{ steps.meta.outputs.ver }}
          DATE: ${{ steps.meta.outputs.date }}
        run: |
          mkdir -p debroot/DEBIAN
          cp -r pkg/. debroot/
          cat > debroot/DEBIAN/control <<EOF
          Package: pc-sim
          Version: ${VER}+${DATE}
          Section: emulators
          Priority: optional
          Architecture: amd64
          Maintainer: BassttElSevic <2911312474@qq.com>
          Depends: libc6, libqt6widgets6
          Description: 8086 CPU/PC simulator (Qt6 GUI)
           A cross-platform 8086 CPU and PC simulator with a Qt6 GUI frontend.
           This package installs the Linux launcher and the BIOS ROM image.
          EOF
          dpkg-deb --build --root-owner-group debroot "pc-sim_${VER}+${DATE}_amd64.deb"

      - name: Package Red Hat/Fedora (.rpm)
        env:
          VER: ${{ steps.meta.outputs.ver }}
          DATE: ${{ steps.meta.outputs.date }}
        run: |
          CLDATE="$(LC_ALL=C date -u '+%a %b %d %Y')"
          rm -rf rpmbuild && mkdir -p rpmbuild/{SPECS,BUILD,BUILDROOT,RPMS,SOURCES}
          REPO="$GITHUB_WORKSPACE"
          cat > rpmbuild/SPECS/pc-sim.spec <<EOF
          Name:           pc-sim
          Version:        ${VER}
          Release:        1.${DATE}
          Summary:        8086 CPU/PC simulator (Qt6 GUI)
          License:        MIT
          URL:            https://github.com/BassttElSevic/8086-CPU-Sim
          BuildArch:      x86_64
          Requires:       glibc, qt6-qtbase

          %description
          A cross-platform 8086 CPU and PC simulator with a Qt6 GUI frontend.

          %install
          mkdir -p %{buildroot}/usr/bin %{buildroot}/usr/share/pc-sim
          cp ${REPO}/pkg/usr/bin/pc_sim_launcher %{buildroot}/usr/bin/pc_sim_launcher
          cp ${REPO}/pkg/usr/share/pc-sim/pc_compat_bios.bin %{buildroot}/usr/share/pc-sim/pc_compat_bios.bin

          %files
          /usr/bin/pc_sim_launcher
          /usr/share/pc-sim/pc_compat_bios.bin

          %changelog
          * ${CLDATE} BassttElSevic <2911312474@qq.com> - ${VER}-1.${DATE}
          - Qt6 GUI frontend
          EOF
          rpmbuild -bb --define "_topdir ${REPO}/rpmbuild" rpmbuild/SPECS/pc-sim.spec
          cp rpmbuild/RPMS/x86_64/*.rpm "pc-sim-${VER}-1.${DATE}.x86_64.rpm"

      - name: Package portable archive (.tar.gz)
        env:
          VER: ${{ steps.meta.outputs.ver }}
          DATE: ${{ steps.meta.outputs.date }}
        run: |
          cd portable
          tar czf "../pc-sim-${VER}-${DATE}.linux-x86_64.tar.gz" pc-sim-linux
          cd ..

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: linux
          path: |
            pc-sim_*_amd64.deb
            pc-sim-*.x86_64.rpm
            pc-sim-*.linux-x86_64.tar.gz

  windows:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Qt (MinGW)
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730
        with:
          version: '6.8.*'
          arch: 'win64_mingw'
          cache: true

      - name: Build Windows launcher (Qt GUI)
        shell: bash
        run: |
          # install-qt-action 装的 MinGW 工具链位于 Qt 安装目录的 Tools/ 下；找到其 bin 加入 PATH
          # （windows-latest 没有预装 make，需用 mingw32-make）。
          QTDIR="$(dirname "$(dirname "$(command -v qmake)")")"
          echo "QTDIR=$QTDIR"
          for d in "$QTDIR"/../Tools/mingw*/bin; do
            [ -d "$d" ] && echo "$d" >> "$GITHUB_PATH"
          done
          PATH="$PATH:$HOME/usr/bin"
          QT_INC="$(qmake -query QT_INSTALL_HEADERS)"
          QT_LIB="$(qmake -query QT_INSTALL_LIBS)"
          echo "QT_INC=$QT_INC  QT_LIB=$QT_LIB"
          export QT_CFLAGS="-I$QT_INC -I$QT_INC/QtWidgets -I$QT_INC/QtGui -I$QT_INC/QtCore"
          export QT_LIBS="-L$QT_LIB -lQt6Widgets -lQt6Gui -lQt6Core"
          mingw32-make clean
          mingw32-make FE=qt TARGET=windows CC=gcc MAKE=mingw32-make
          mkdir -p portable/pc-sim-win
          cp dist/apps/pc_sim_launcher.exe portable/pc-sim-win/
          cp dist/firmware/pc_compat_bios.bin portable/pc-sim-win/

      - name: Bundle Qt runtime (windeployqt)
        shell: bash
        run: |
          # 在可执行文件旁部署必需的 Qt DLL / 插件，实现解压即用。
          windeployqt --release portable/pc-sim-win/pc_sim_launcher.exe
          cat > portable/pc-sim-win/README.txt <<'EOF'
          8086 CPU Simulator — 免安装、免编译，解压即用

          启动方式：双击本文件夹里的 pc_sim_launcher.exe

          本目录已内置 BIOS 镜像与 Qt 运行库，双击即可运行。
          如需软盘镜像 / 虚拟硬盘，可在界面里浏览并选择对应文件。
          EOF

      - name: Zip Windows package
        shell: bash
        env:
          VER: ${{ github.ref_name }}
        run: |
          mkdir -p ../out
          ( cd portable && zip -r "../pc-sim-${VER#v}-$(date +%Y%m%d).win-x86_64.zip" pc-sim-win )

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows
          path: pc-sim-*.win-x86_64.zip

  macos:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Qt (clang_64)
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730
        with:
          version: '6.8.*'
          arch: 'clang_64'
          cache: true

      - name: Build macOS launcher (Qt GUI)
        run: |
          QT_INC="$(qmake -query QT_INSTALL_HEADERS)"
          QT_LIB="$(qmake -query QT_INSTALL_LIBS)"
          export QT_CFLAGS="-I$QT_INC -I$QT_INC/QtWidgets -I$QT_INC/QtGui -I$QT_INC/QtCore"
          export QT_LIBS="-F$QT_LIB -framework QtWidgets -framework QtGui -framework QtCore"
          export QT_CXX="clang++"
          make clean
          make FE=qt CC=cc CXX=clang++
          mkdir -p portable/pc-sim-mac
          cp dist/apps/pc_sim_launcher portable/pc-sim-mac/
          cp dist/firmware/pc_compat_bios.bin portable/pc-sim-mac/

      - name: Bundle Qt runtime (macdeployqt)
        run: |
          # macdeployqt 把一个 Qt 可执行文件打成一个可运行的 .app 并内嵌框架。
          macdeployqt portable/pc-sim-mac/pc_sim_launcher -dylib -always-overwrite || true
          cat > portable/pc-sim-mac/README.txt <<'EOF'
          8086 CPU Simulator — 免安装、免编译，解压即用

          启动方式：./pc_sim_launcher （Qt6 框架已随包内嵌；若失败请改用 Homebrew
          安装 qt 后，在本目录执行: ./pc_sim_launcher）

          本目录已内置 BIOS 镜像（pc_compat_bios.bin）。
          EOF

      - name: Tar macOS package
        env:
          VER: ${{ github.ref_name }}
        run: |
          mkdir -p ../out
          ( cd portable && tar czf "../pc-sim-${VER#v}-$(date +%Y%m%d).macos-x86_64.tar.gz" pc-sim-mac )

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos
          path: pc-sim-*.macos-x86_64.tar.gz

  arch:
    runs-on: ubuntu-latest
    container: archlinux:latest
    continue-on-error: true
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install toolchain (含 Qt6)
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel qt6-base

      - name: Build Arch launcher (Qt GUI)
        env:
          VER: ${{ github.ref_name }}
        run: |
          make clean
          make            # pacman 装了 qt6-base，pkg-config 可探测
          mkdir -p portable/pc-sim-arch
          cp dist/apps/pc_sim_launcher portable/pc-sim-arch/
          cp dist/firmware/pc_compat_bios.bin portable/pc-sim-arch/
          cat > portable/pc-sim-arch/README.txt <<'EOF'
          8086 CPU Simulator — Arch Linux 便携版

          启动：./pc_sim_launcher（需已安装 qt6-base）
          本目录已内置 BIOS 镜像（pc_compat_bios.bin）。
          EOF
          ( cd portable && tar czf "../pc-sim-${VER#v}-$(date +%Y%m%d).arch-linux-x86_64.tar.gz" pc-sim-arch )

      - name: Upload Arch artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: arch
          path: pc-sim-*.arch-linux-x86_64.tar.gz

  release:
    needs: [linux, windows, macos, arch]
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: dist-artifacts

      - name: Assemble & checksum
        run: |
          # 把所有平台的产物摊平到当前目录，生成校验和。
          find dist-artifacts -type f -exec cp -n {} . \;
          sha256sum pc-sim_*_amd64.deb pc-sim-*.x86_64.rpm \
                    pc-sim-*.linux-x86_64.tar.gz \
                    pc-sim-*.win-x86_64.zip \
                    pc-sim-*.macos-x86_64.tar.gz \
                    pc-sim-*.arch-linux-x86_64.tar.gz > SHA256SUMS 2>/dev/null || true

      - name: Write release notes
        env:
          VER: ${{ github.ref_name }}
        run: |
          cat > RELEASE_BODY.md <<EOF
          ## 8086 CPU Simulator — ${VER}

          免安装、免编译的 Qt6 跨平台图形界面。

          | 平台 | 格式 | 说明 |
          |---|---|---|
          | Windows | .zip | 解压后双击 \`pc_sim_launcher.exe\`（已内嵌 Qt 运行库） |
          | Debian/Ubuntu | .deb | \`sudo apt install ./<file>.deb\` |
          | Red Hat/Fedora | .rpm | \`sudo rpm -i <file>.rpm\` |
          | Linux 通用 | .tar.gz | 解压后 \`./pc_sim_launcher\`（需系统装 Qt6） |
          | macOS | .tar.gz | 解压后 \`./pc_sim_launcher\`（已内嵌 Qt 框架） |
          | Arch Linux | .tar.gz | 解压后 \`./pc_sim_launcher\`（需系统装 qt6-base） |

          所有包均内置 \`pc_compat_bios.bin\`。校验和见 \`SHA256SUMS\`。

          > 前端为 Qt6 Widgets（Core/Gui/Widgets），复古蓝白 + 像素风。
          > Windows/macOS/Arch 产物由云端 CI 构建；个别平台若有打包差异，以上表为准。
          EOF

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@5113cdc90fd4d541c801c55356214017bf5ae34b
        with:
          files: |
            pc-sim_*_amd64.deb
            pc-sim-*.x86_64.rpm
            pc-sim-*.linux-x86_64.tar.gz
            pc-sim-*.win-x86_64.zip
            pc-sim-*.macos-x86_64.tar.gz
            pc-sim-*.arch-linux-x86_64.tar.gz
            SHA256SUMS
          body_path: RELEASE_BODY.md
